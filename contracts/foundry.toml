[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 512

# Robinhood Chain (chain ID 4663). The public RPC is rate-limited; it is fine
# for deploying and for the demo, not for heavy traffic.
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
