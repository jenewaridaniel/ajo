[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
# Tests only: the measured random walk in AjoInvariant.t.sol runs 6,000 steps in one test.
gas_limit = "100000000000"

[fuzz]
runs = 512

[invariant]
runs = 300
depth = 60

# Robinhood Chain (chain ID 4663). The public RPC is rate-limited; it is fine
# for deploying and for the demo, not for heavy traffic.
[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
